  relationship: background
  note: Manuscript by Tom Adamczewski (Epoch AI) and Thomas F. Bloom (University of Manchester), 2026, describing
    the benchmark of 68 open Erdős problems, the agent harness, the verification protocol and the results; this
    resolution is reported in its Results section and summarised in its appendix. The benchmark and Lean statements
