status:
  scope: 'Fully formalized: the compared theorem `Erdos1.erdos_1.disproof` in `Challenge.lean` is proved in `Solution.lean`
    via the imported module `Erdos1.Resolutions.Erdos1_219usd_38h` with no `sorry` and no axioms beyond propext,
    Quot.sound and Classical.choice. The 1 further module(s) in `Erdos1/Resolutions/` are independent complete proofs
    of the same statement, built as the separate Lake library `Erdos1Alternates` but not compared by Comparator.
    Only the negation of the formal conjecture is advertised; the stronger facts visible in the proofs (for example
    explicit budgets or 3-colourability) are not part of the compared statement. Nothing about the informal problem
    was omitted or weakened relative to the benchmark''s formal statement; see fidelity.divergences for the relation
    between that formal statement and the informal problem.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: autonomous
    models:
    - GPT-6 Astra (pre-release version, OpenAI)
    framework: Inspect AI (UK AISI) with the LeanOpenProblems task harness; deepagent-based agent for default-configuration
      attempts, basic ReAct agent for the larger-budget attempts
    tool_setup: The model worked alone in a Docker container without network access, with bash, a text editor, a
      resource-budget tool, a Lean 4 toolchain (v4.27.0) with Mathlib (via Formal Conjectures at commit 488aade228ec),
      SageMath, Python (sympy, mpmath, numpy, pantograph) and, in the default configuration, subagents, persistent
      memory, a todo list and an offline snapshot of about 476,000 pure-mathematics arXiv LaTeX sources (proof-pile,
      up to 2022). Its submission was checked in a separate pristine container by Comparator (Lean FRO) against
      the trusted statement, permitting only the three standard axioms.
    cost:
      wall_time: 27 hours of agent working time for the primary resolution (harness working_time, excluding API
        retry waits); 111 hours across all 2 resolutions included here
      spend_usd: 405 USD for the primary resolution, computed from its token counts at GPT-6 Astra's standard rates
        (USD 10 per million input tokens, 50 per million output tokens, 1 per million cache-read tokens and 12.50
        per million cache-write tokens); 1790 USD across all 2 resolutions included here
      hardware: API-only inference; the agent's sandbox ran on Epoch AI's cloud evaluation infrastructure (Hawk)
    prompting_notes: 'Fixed task prompt from the harness (apn/prompts.py in LeanOpenProblems): settle the conjecture
      in Spec.lean by filling the `sorry` of either the statement or its `.disproof` negation without altering either
      statement or the imports, using only the permitted axioms; a description of the available tools; and general
      encouragement that open conjectures are not infeasible. No problem-specific hints or human interaction. Transcripts
      are linked in the README.'
  spend_usd: 1790 USD across the 2 resolution attempt(s) included in this repository, at GPT-6 Astra's standard
    rates; the paper reports over 220,000 USD of compute across all attempts on all 68 benchmark problems
  notes: 'The Lean development was written entirely by the AI system inside the benchmark harness. Humans (Thomas
    F. Bloom) selected the problem and reviewed the formal statement for faithfulness before the run; humans (Tom
    Adamczewski) ran the harness and, after the run, packaged the verified output into this repository. The only
    edits to the AI-written files are mechanical and are listed in the README: removed the sorry''d stub of the
    original conjecture `erdos_1` (lines 22–31 of the original) together with its docstring; restated `Erdos1.erdos_1.disproof`
    explicitly (the original used `¬ (type_of% @Erdos1.erdos_1)`, which referenced the removed stub) and added a
    docstring.'
fidelity:
  divergences: 'None known between the compared theorem and the conjecture as stated on erdosproblems.com. The formal
    conjecture `Erdos1.erdos_1` (Formal Conjectures) reads: there is `C > 0` such that `C · 2^|A| < N` for every
    `N ≠ 0` and every sum-distinct `A ⊆ {1, …, N}`; the compared theorem is exactly its negation. The hypothesis
    `N ≠ 0` only excludes the degenerate empty interval. The disproof is ineffective (no explicit `n(ε)`).'
review:
  status: 'mechanically verified (Comparator: Lean kernel replay, standard axioms only) in the benchmark harness
    and again in this repository''s CI; preliminary informal reading of the argument by Thomas F. Bloom; no independent
    refereeing'
  reviewers:
  - Thomas F. Bloom
  notes: 'Statement audit: the formal statement was selected and reviewed for faithfulness to the informal problem
    by Thomas F. Bloom before the benchmark run (for Formal Conjectures statements he chose the representative statement;
    autoformalized statements he checked individually). Mathematical review: the resolution was verified by Comparator
    against the trusted statement; Thomas F. Bloom made an initial, informal examination of the argument and wrote
    a short exposition (FrontierMath Erdős appendix and erdosproblems.com). The paper states that the proofs have
    not yet been properly digested by human experts.'
alignment:
  namespace: Erdos1
  statements:
  - source: erdosproblems.com/1, as formalized in Formal Conjectures (`Erdos1.erdos_1`)
    lean: Erdos1.erdos_1.disproof
    module: Challenge
    status: proved
    note: The compared theorem is the negation of the formal conjecture; proving it disproves the conjecture. Its
      exact text is identical to the benchmark statement (Comparator enforces this against the imported proof module).
