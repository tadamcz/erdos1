  id: https://www.erdosproblems.com/1
  location: https://www.erdosproblems.com/1
  relationship: background
  note: Problem page with statement, history, references and (since the resolution) an informal exposition by Thomas
    F. Bloom.
- title: Some of my new and almost new problems and results in combinatorial number theory
